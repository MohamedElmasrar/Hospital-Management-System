spring.application.name=analytics-service
server.port=8005
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
analytics.kafka.topic=${ANALYTICS_KAFKA_TOPIC:hms.analytics.events}

# Load development fixtures after Hibernate creates the schema.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
