spring.application.name=notification-service
spring.jpa.open-in-view=false
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=notification-service
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.auto-startup=${KAFKA_LISTENER_AUTO_STARTUP:true}
notification.kafka.topic=${NOTIFICATION_KAFKA_TOPIC:hms.notifications.events}
server.port=8006
spring.jpa.hibernate.ddl-auto=update
jwt.secret=${JWT_SECRET:oaihfiouehaoifuhieluhafishefiuashiehfoiuksydfiauhefaw+}
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Load development fixtures after Hibernate creates the schema.
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
