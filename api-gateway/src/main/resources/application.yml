server:
  port: 8000 # Gateway listens on port 8000

auth:
  service:
    url: ${AUTH_SERVICE_URL:http://auth-service:8001}


spring:
  cloud:
    gateway:
      routes:
        - id: auth-service-route
          uri: http://auth-service:8001
          predicates:
            - Path=/auth/**
          filters:
            - StripPrefix=1

        # Route for /api/hr/** to hr-service
        - id: hr-service-route
          uri: http://hr-service:8002
          predicates:
            - Path=/api/hr/**
          filters:
            - StripPrefix=2
            - JwtValidation

        # Route for /api-docs/hr to hr-service /v3/api-docs
        - id: api-docs-hr-route
          uri: http://hr-service:8002
          predicates:
            - Path=/api-docs/hr/**, /api-docs/hr
          filters:
            - RewritePath=/api-docs/hr(?<segment>/?.*), /v3/api-docs${segment}

        - id: api-docs-auth-route
          uri: http://auth-service:8001
          predicates:
            - Path=/api-docs/auth/**, /api-docs/auth
          filters:
            - RewritePath=/api-docs/auth(?<segment>/?.*), /v3/api-docs${segment}

        # Route for /api/billing/** to billing-service
        - id: billing-service-route
          uri: http://billing-service:8003
          predicates:
            - Path=/api/billing/**
          filters:
            - StripPrefix=2
            - JwtValidation

        # Route for /api-docs/billing to billing-service /v3/api-docs
        - id: api-docs-billing-route
          uri: http://billing-service:8003
          predicates:
            - Path=/api-docs/billing/**, /api-docs/billing
          filters:
            - RewritePath=/api-docs/billing(?<segment>/?.*), /v3/api-docs${segment}

        # Route for /api/reception/** to reception-service
        - id: reception-service-route
          uri: http://reception-service:8004
          predicates:
            - Path=/api/reception/**
          filters:
            - StripPrefix=2
            - JwtValidation

        # Route for /api-docs/reception to reception-service /v3/api-docs
        - id: api-docs-reception-route
          uri: http://reception-service:8004
          predicates:
            - Path=/api-docs/reception/**, /api-docs/reception
          filters:
            - RewritePath=/api-docs/reception(?<segment>/?.*), /v3/api-docs${segment}