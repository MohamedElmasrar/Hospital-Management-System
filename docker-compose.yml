services:
  api-gateway:
    container_name: api-gateway
    build: ./api-gateway/
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001/
    depends_on:
      auth-service:
        condition: service_started
      hr-service:
        condition: service_started
      billing-service:
        condition: service_started
      reception-service:
        condition: service_started
      analytics-service:
        condition: service_started
  auth-service:
    container_name: auth-service
    build: ./auth-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      auth-db:
        condition: service_healthy
  hr-service:
    container_name: hr-service
    build: ./hr-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hr-db:5432/hrDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
    depends_on:
      hr-db:
        condition: service_healthy
  billing-service:
    container_name: billing-service
    build: ./billing-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/billingDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      HR_GRPC_HOST: hr-service
      HR_GRPC_PORT: 9091
    depends_on:
      billing-db:
        condition: service_healthy
      hr-service:
        condition: service_started


  reception-service:
    container_name: reception-service
    build: ./reception-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reception-db:5432/receptionDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      HR_GRPC_HOST: hr-service
      HR_GRPC_PORT: 9091
    depends_on:
      reception-db:
        condition: service_healthy
      hr-service:
        condition: service_started

  analytics-service:
    container_name: analytics-service
    build: ./analytics-service/


  auth-db:
    image: postgres:17
    container_name: auth-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authDB
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d authDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  hr-db:
    image: postgres:17
    container_name: hr-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hrDB
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hrDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-db:
    image: postgres:17
    container_name: billing-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: billingDB
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d billingDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  reception-db:
    image: postgres:17
    container_name: reception-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: receptionDB
    volumes:
      - reception-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d receptionDB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  auth-db-data:
  hr-db-data:
  billing-db-data:
  reception-db-data:
