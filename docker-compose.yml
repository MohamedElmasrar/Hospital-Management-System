services:
  api-gateway:
    container_name: hms-api-gateway
    build: ./api-gateway/
    ports:
      - "8000:8000"
    environment:
      AUTH_SERVICE_URL: http://auth-service:8001/
    depends_on:
      auth-service:
        condition: service_started
      hr-service:
        condition: service_started
      billing-service:
        condition: service_started
      reception-service:
        condition: service_started
      analytics-service:
        condition: service_started
      notification-service:
        condition: service_started
  auth-service:
    container_name: hms-auth-service
    build: ./auth-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-db:5432/authDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      auth-db:
        condition: service_healthy
      kafka:
        condition: service_started
  hr-service:
    container_name: hms-hr-service
    build: ./hr-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hr-db:5432/hrDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      hr-db:
        condition: service_healthy
      kafka:
        condition: service_started
  billing-service:
    container_name: hms-billing-service
    build: ./billing-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://billing-db:5432/billingDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      HR_GRPC_HOST: hr-service
      HR_GRPC_PORT: 9091
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      billing-db:
        condition: service_healthy
      hr-service:
        condition: service_started
      kafka:
        condition: service_started


  reception-service:
    container_name: hms-reception-service
    build: ./reception-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://reception-db:5432/receptionDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      HR_GRPC_HOST: hr-service
      HR_GRPC_PORT: 9091
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      reception-db:
        condition: service_healthy
      hr-service:
        condition: service_started
      kafka:
        condition: service_started

  analytics-service:
    container_name: hms-analytics-service
    build: ./analytics-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://analytics-db:5432/analyticsDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      analytics-db:
        condition: service_healthy
      kafka:
        condition: service_started

  notification-service:
    container_name: hms-notification-service
    build: ./notification-service/
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://notification-db:5432/notificationDB
      SPRING_DATASOURCE_USERNAME: admin
      SPRING_DATASOURCE_PASSWORD: password
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      notification-db:
        condition: service_healthy
      kafka:
        condition: service_started

  kafka:
    image: apache/kafka:4.1.2
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw


  auth-db:
    image: postgres:17
    container_name: hms-auth-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: authDB
    volumes:
      - auth-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d authDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  hr-db:
    image: postgres:17
    container_name: hms-hr-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: hrDB
    volumes:
      - hr-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d hrDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  billing-db:
    image: postgres:17
    container_name: hms-billing-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: billingDB
    volumes:
      - billing-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d billingDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  reception-db:
    image: postgres:17
    container_name: hms-reception-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: receptionDB
    volumes:
      - reception-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d receptionDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  analytics-db:
    image: postgres:17
    container_name: hms-analytics-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: analyticsDB
    volumes:
      - analytics-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d analyticsDB"]
      interval: 5s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:17
    container_name: hms-notification-db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: notificationDB
    volumes:
      - notification-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d notificationDB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  notification-db-data:
  auth-db-data:
  hr-db-data:
  billing-db-data:
  reception-db-data:
  analytics-db-data:
