name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.matrix.outputs.java }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          base: ${{ github.event.pull_request.base.ref || github.event.repository.default_branch || github.ref_name }}
          filters: |
            auth:
              - 'auth-service/**'
              - '.github/workflows/ci.yml'
            billing:
              - 'billing-service/**'
              - '.github/workflows/ci.yml'
            hr:
              - 'hr-service/**'
              - '.github/workflows/ci.yml'
            reception:
              - 'reception-service/**'
              - '.github/workflows/ci.yml'
            analytics:
              - 'analytics-service/**'
              - '.github/workflows/ci.yml'
            notification:
              - 'notification-service/**'
              - '.github/workflows/ci.yml'
            gateway:
              - 'api-gateway/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
      - name: Build changed Java service matrix
        id: matrix
        env:
          AUTH: ${{ steps.filter.outputs.auth }}
          BILLING: ${{ steps.filter.outputs.billing }}
          HR: ${{ steps.filter.outputs.hr }}
          RECEPTION: ${{ steps.filter.outputs.reception }}
          ANALYTICS: ${{ steps.filter.outputs.analytics }}
          NOTIFICATION: ${{ steps.filter.outputs.notification }}
          GATEWAY: ${{ steps.filter.outputs.gateway }}
        run: |
          echo "java=$(jq -nc \
            --arg auth "$AUTH" \
            --arg billing "$BILLING" \
            --arg hr "$HR" \
            --arg reception "$RECEPTION" \
            --arg analytics "$ANALYTICS" \
            --arg notification "$NOTIFICATION" \
            --arg gateway "$GATEWAY" \
            '[
              {service: "auth-service", changed: $auth},
              {service: "billing-service", changed: $billing},
              {service: "hr-service", changed: $hr},
              {service: "reception-service", changed: $reception},
              {service: "analytics-service", changed: $analytics},
              {service: "notification-service", changed: $notification},
              {service: "api-gateway", changed: $gateway}
            ] | map(select(.changed == "true")) | map({service}) | {include: .}' \
            )" >> "$GITHUB_OUTPUT"

  java:
    name: Java - ${{ matrix.service }}
    needs: changes
    if: needs.changes.outputs.java != '{"include":[]}'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.java) }}
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Check formatting and run tests
        run: ./gradlew spotlessCheck test

  frontend:
    name: Frontend lint and checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Start backend services for API generation
        run: docker compose up -d --build
        working-directory: .
      - name: Wait for API gateway
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://localhost:8000/api-docs/auth >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          echo "API gateway did not become ready in time" >&2
          docker compose logs
          exit 1
      - run: npm run api:generate
      - if: always()
        name: Stop backend services
        run: docker compose down
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
