name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changed components
    runs-on: ubuntu-latest
    outputs:
      auth: ${{ steps.filter.outputs.auth }}
      billing: ${{ steps.filter.outputs.billing }}
      hr: ${{ steps.filter.outputs.hr }}
      reception: ${{ steps.filter.outputs.reception }}
      analytics: ${{ steps.filter.outputs.analytics }}
      notification: ${{ steps.filter.outputs.notification }}
      gateway: ${{ steps.filter.outputs.gateway }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            auth:
              - 'auth-service/**'
              - '.github/workflows/ci.yml'
            billing:
              - 'billing-service/**'
              - '.github/workflows/ci.yml'
            hr:
              - 'hr-service/**'
              - '.github/workflows/ci.yml'
            reception:
              - 'reception-service/**'
              - '.github/workflows/ci.yml'
            analytics:
              - 'analytics-service/**'
              - '.github/workflows/ci.yml'
            notification:
              - 'notification-service/**'
              - '.github/workflows/ci.yml'
            gateway:
              - 'api-gateway/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'

  java:
    name: Java - ${{ matrix.service }}
    needs: changes
    if: |
      (matrix.service == 'auth-service' && needs.changes.outputs.auth == 'true') ||
      (matrix.service == 'billing-service' && needs.changes.outputs.billing == 'true') ||
      (matrix.service == 'hr-service' && needs.changes.outputs.hr == 'true') ||
      (matrix.service == 'reception-service' && needs.changes.outputs.reception == 'true') ||
      (matrix.service == 'analytics-service' && needs.changes.outputs.analytics == 'true') ||
      (matrix.service == 'notification-service' && needs.changes.outputs.notification == 'true') ||
      (matrix.service == 'api-gateway' && needs.changes.outputs.gateway == 'true')
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - auth-service
          - billing-service
          - hr-service
          - reception-service
          - analytics-service
          - notification-service
          - api-gateway
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Make Gradle wrapper executable
        run: chmod +x gradlew
      - name: Check formatting and run tests
        run: ./gradlew spotlessCheck test

  frontend:
    name: Frontend lint and checks
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npx tsc --noEmit
